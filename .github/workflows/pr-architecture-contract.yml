name: PR Architecture Contract

# Deterministic check that the PR body follows the architecture contract in
# .github/pull_request_template.md (governance: docs/adr/0003).
#
# TRUST BOUNDARY (why pull_request_target is safe here):
#   - the workflow DEFINITION is loaded from the protected base branch, so a
#     PR cannot rewrite this file to change what runs against itself;
#   - the CHECKER SCRIPT is checked out from the exact protected base commit
#     (github.event.pull_request.base.sha) into ./trusted-base — no PR code
#     (merge ref, head.sha, contributor branch, or any PR file) is ever
#     checked out or executed;
#   - the PULL REQUEST BODY is the only PR-controlled input, and it is passed
#     as untrusted DATA through the PR_BODY environment variable — never
#     interpolated into a shell command, script, path, or argument;
#   - permissions are explicitly read-only and no secrets are used, so even a
#     hypothetical escape has nothing to write with and nothing to steal.
#
# `edited` re-runs the check when the body is fixed.
#
# REQUIRED status check on `main` (branch protection observed 2026-08-18),
# alongside Quality Gate. It began advisory (PR #109) and became required after
# this trusted design was proven on a real PR post-merge — see ADR-0003
# ("Transition to required").

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture-contract:
    name: PR Architecture Contract
    runs-on: ubuntu-latest
    steps:
      # Trusted checkout: exactly the protected base commit, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base

      - uses: actions/setup-python@v5
        with:
          # Nxentra CI standard (ci.yml PYTHON_VERSION).
          python-version: "3.11"

      - name: Check PR body against the architecture contract
        env:
          # Untrusted data only — passed via env (never shell-interpolated) so
          # arbitrary body content cannot inject into the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
        # Trusted code path: the checker from the base SHA checkout.
        run: python trusted-base/scripts/check_pr_architecture_contract.py
